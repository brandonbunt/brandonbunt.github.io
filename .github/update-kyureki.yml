name: Update Kyureki

on:
  schedule:
    - cron: '0 * * * *'   # once per hour
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4 pillow

    - name: Run Kyureki generator
      run: |
        python kyureki/scripts/generate_kyureki.py

    - name: Commit and push changes
      run: |
        git config user.name "kyureki-bot"
        git config user.email "kyureki-bot@users.noreply.github.com"
        git add kyureki/
        git commit -m "Daily kyureki update" || echo "No changes"
        git push
