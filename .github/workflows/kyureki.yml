name: Update Kyureki

on:
  schedule:
    # Runs every day at 00:15 UTC
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-kyureki:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r projects/kyureki_scripts/requirements.txt

      - name: Run Kyureki generator
        run: |
          python projects/kyureki_scripts/gen_kyureki_v1.3.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kyureki/
          git commit -m "Update Kyureki data and images" || echo "No changes to commit"
          git push
