<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>今日のこよみ - Today's Microseason</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #f5f5f5;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .container {
        max-width: 100%;
        padding: 20px;
        text-align: center;
    }
    .date-header {
        font-size: 24px;
        font-weight: 300;
        color: #333;
        margin-bottom: 10px;
    }
    .rokuyo-header {
        font-size: 18px;
        font-weight: 400;
        color: #666;
        margin-bottom: 20px;
    }
    .image-container {
        margin-bottom: 20px;
    }
    img {
        max-width: 100%;
        height: auto;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        border-radius: 8px;
        display: none;
    }
    img.active {
        display: block;
        margin: 0 auto;
    }
    .toggle-btn {
        margin: 5px;
        padding: 8px 16px;
        background-color: #2196F3;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 14px;
        cursor: pointer;
    }
    .toggle-btn.active {
        background-color: #0b7dda;
    }
    .toggle-btn:hover {
        background-color: #0b7dda;
    }
    .button-container {
        display: flex;
        justify-content: center;
        gap: 10px;
        max-width: 800px;
        margin: 0 auto;
    }
    .label {
        margin-top: 20px;
        font-size: 14px;
        color: #666;
    }
</style>
<script>
function showOriginal() {
    document.getElementById('original').classList.add('active');
    document.getElementById('dithered').classList.remove('active');
    document.getElementById('btnOriginal').classList.add('active');
    document.getElementById('btnDithered').classList.remove('active');
}

function showDithered() {
    document.getElementById('dithered').classList.add('active');
    document.getElementById('original').classList.remove('active');
    document.getElementById('btnDithered').classList.add('active');
    document.getElementById('btnOriginal').classList.remove('active');
}

// Load data.json dynamically
async function loadKyurekiData() {
    try {
        const res = await fetch('data.json');
        const data = await res.json();

        document.getElementById('date').textContent = data.date;
        document.getElementById('rokuyo').textContent = `六曜: ${data.rokuyo}`;

        document.getElementById('original').src = data.image;
        document.getElementById('dithered').src = data.dithered_image;

        showDithered(); // show e-ink style by default
    } catch (err) {
        console.error("Failed to load Kyureki data:", err);
    }
}

window.onload = loadKyurekiData;
</script>
</head>
<body>
<div class="container">
    <div id="date" class="date-header"></div>
    <div id="rokuyo" class="rokuyo-header"></div>

    <div class="image-container">
        <img id="original" alt="Original Microseason">
        <img id="dithered" alt="Dithered Microseason">
    </div>

    <div class="button-container">
        <button id="btnOriginal" class="toggle-btn" onclick="showOriginal()">Original</button>
        <button id="btnDithered" class="toggle-btn active" onclick="showDithered()">E-ink</button>
    </div>

    <div class="label">
        Image: <a href="https://www.kurashikata.com/?post_type=koyomi" target="_blank">kurashikata.com</a> |
        Rokuyō info: <a href="https://rokuyo.org/rokuyo/calendar.php" target="_blank">rokuyo.org</a>
    </div>
</div>
</body>
</html>
